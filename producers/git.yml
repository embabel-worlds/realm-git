# Every producer reads a git repository through the appliance's `git` producer kind, from a clone
# (or a folder's own .git) when a query reaches it. Nothing is stored.
#
# THE VOCABULARY CONTRACT. GitCommit is a child of the dev vocabulary's Commit and GitFileChange of
# its FileChange (types/git.yml), so `compute:` maps what git records onto the parents' names, as
# realm-github does for what GitHub reports. Each is one Cypher expression over the row, bound as `r`.
#
# authorKind, from what git alone knows: there is no forge account here, so `assisted` is a
# Co-Authored-By trailer naming a coding agent, `bot` and `agent` an author whose name or address
# carries `[bot]`, and everything else `human`. A message that SAYS an agent had a hand ("Apply claude
# suggestion", "Generated with [Claude Code]") is `assisted` too; a message that merely names one
# ("Add Gemini models") is not. `agentEvidence` says which it was: trailer or message. An agent's
# work pasted in with no trailer and no such sentence reads as human, as it does on every forge.
#
# kind is the vocabulary's file kind (source, test, docs, build, config, data, other), decided from
# the path alone by the rule in realm-dev-vocabulary types/vocabulary.yml: the SAME expression
# realm-github carries, so a file is the same kind whichever realm read it.

# The commits behind the one a project is read at, newest first. `fileKinds` is that rule applied to
# each path the commit touched, and `languages` the language of each code extension: what
# characterising a commit takes, from names alone.
- name: gitCommits
  kind: git
  emit: commits
  compute:
    repositoryKey: "toLower(r.repository)"
    key: "toLower(r.repository) + '@' + r.sha"
    projectKey: "CASE WHEN r.project STARTS WITH 'https://' THEN 'https://' + r.repository + '@' + r.sha ELSE r.project END"
    title: "r.subject"
    authorKind: "CASE WHEN (toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]') AND any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(r.authorName) CONTAINS x) THEN 'agent' WHEN toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]' THEN 'bot' WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) OR (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'assisted' ELSE 'human' END"
    agentEvidence: "CASE WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) THEN 'trailer' WHEN (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'message' ELSE '' END"
    isRevert: "r.subject STARTS WITH 'Revert '"
    changeRequestNumber: "CASE WHEN r.subject ENDS WITH ')' AND r.subject CONTAINS '(#' THEN toInteger(split(last(split(r.subject, '(#')), ')')[0]) WHEN r.subject STARTS WITH 'Merge pull request #' THEN toInteger(split(split(r.subject, '#')[1], ' ')[0]) ELSE null END"
    sourceUrl: "r.link"
    changesKey: "r.project + '!' + r.sha"
    fileKinds: "[q IN r.paths | head([p IN [toLower(q)] | head([c IN [last(split(q, '/'))] | head([f IN [toLower(c)] | head([e IN [CASE WHEN f CONTAINS '.' THEN last(split(f, '.')) ELSE '' END] | CASE WHEN any(x IN ['/test/', '/tests/', '/__tests__/', '/spec/', '/it/', '/testing/', '/testdata/'] WHERE p CONTAINS x) OR any(x IN ['test/', 'tests/', 'spec/', 'testing/', 'testdata/'] WHERE p STARTS WITH x) OR any(x IN ['Test.kt', 'Tests.kt', 'Test.java', 'Tests.java', 'Test.scala', 'Spec.kt', 'Spec.scala', 'Test.cs', 'Tests.cs', 'Test.swift', 'Tests.swift', 'Test.groovy', 'Spec.groovy'] WHERE c ENDS WITH x) OR any(x IN ['.test.ts', '.test.tsx', '.test.js', '.test.jsx', '.test.mjs', '.test.cjs', '.spec.ts', '.spec.tsx', '.spec.js', '.spec.jsx', '.spec.mjs', '_test.go', '_test.py', '_test.rb', '_spec.rb', '_test.exs', '_test.dart'] WHERE f ENDS WITH x) OR (f STARTS WITH 'test_' AND e = 'py') THEN 'test' WHEN e IN ['md', 'mdx', 'adoc', 'asciidoc', 'rst', 'txt'] OR any(x IN ['docs/', 'doc/'] WHERE p STARTS WITH x) OR any(x IN ['/docs/', '/doc/'] WHERE p CONTAINS x) OR f IN ['license', 'notice', 'changelog', 'contributing', 'code_of_conduct', 'authors', 'security', 'codeowners'] OR f STARTS WITH 'readme' OR f STARTS WITH 'license' THEN 'docs' WHEN f IN ['pom.xml', 'build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts', 'gradle.properties', 'mvnw', 'mvnw.cmd', 'gradlew', 'gradlew.bat', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'pyproject.toml', 'setup.py', 'setup.cfg', 'pipfile', 'pipfile.lock', 'poetry.lock', 'uv.lock', 'go.mod', 'go.sum', 'cargo.toml', 'cargo.lock', 'gemfile', 'gemfile.lock', 'makefile', 'cmakelists.txt', 'jenkinsfile', 'flake.nix', 'flake.lock', '.gitlab-ci.yml', 'bitbucket-pipelines.yml', 'renovate.json', 'build.xml', 'build.sbt', 'project.clj', 'deps.edn', 'mix.exs', 'composer.json', 'composer.lock', 'webpack.config.js', 'vite.config.ts', 'vite.config.js', 'vitest.config.ts', 'vitest.config.mjs', 'jest.config.js', 'jest.config.ts', 'babel.config.js', 'rollup.config.js', 'esbuild.mjs', '.npmrc', '.nvmrc', '.tool-versions', 'sonar-project.properties', '.sonarcloud.properties'] OR any(x IN ['tsconfig', 'dockerfile', 'docker-compose', 'compose.', 'requirements'] WHERE f STARTS WITH x) OR any(x IN ['.csproj', '.fsproj', '.vbproj', '.sln', '.props', '.targets', '.gradle', '.gradle.kts', '.nix', '.lock', '.cmake'] WHERE f ENDS WITH x) OR any(x IN ['.github/', '.gitlab/', '.circleci/', '.buildkite/', '.mvn/', 'gradle/', '.azure-pipelines/', '.devcontainer/'] WHERE p STARTS WITH x) OR p CONTAINS '/.github/' THEN 'build' WHEN e IN ['kt', 'kts', 'java', 'scala', 'groovy', 'clj', 'cljs', 'ts', 'tsx', 'js', 'jsx', 'mjs', 'cjs', 'vue', 'svelte', 'py', 'pyi', 'go', 'rs', 'rb', 'php', 'cs', 'fs', 'vb', 'swift', 'm', 'mm', 'c', 'cc', 'cpp', 'cxx', 'h', 'hpp', 'hh', 'sh', 'bash', 'zsh', 'fish', 'ps1', 'bat', 'cmd', 'sql', 'cypher', 'cql', 'html', 'htm', 'css', 'scss', 'sass', 'less', 'dart', 'lua', 'pl', 'pm', 'r', 'jl', 'ex', 'exs', 'erl', 'hs', 'ml', 'mli', 'elm', 'proto', 'graphql', 'gql', 'tf', 'hcl', 'wasm', 'wat', 'ipynb', 'jinja', 'j2', 'ftl', 'mustache', 'hbs', 'ejs', 'jsp', 'thymeleaf', 'scm', 'lisp', 'el'] THEN 'source' WHEN e IN ['csv', 'tsv', 'parquet', 'avro', 'orc', 'jsonl', 'ndjson', 'xlsx', 'xls', 'sqlite', 'db', 'arrow', 'feather', 'npy'] THEN 'data' WHEN e IN ['yml', 'yaml', 'json', 'json5', 'xml', 'properties', 'toml', 'ini', 'cfg', 'conf', 'env', 'editorconfig', 'gitignore', 'gitattributes', 'dockerignore', 'npmignore', 'prettierrc', 'eslintrc', 'plist', 'service'] OR f STARTS WITH '.' THEN 'config' ELSE 'other' END])])])])]"
    languages: "[e IN r.extensions WHERE e IN ['java', 'kt', 'kts', 'scala', 'groovy', 'ts', 'tsx', 'js', 'jsx', 'mjs', 'cjs', 'py', 'go', 'rs', 'rb', 'php', 'cs', 'swift', 'c', 'h', 'cpp', 'cc', 'hpp', 'sql', 'sh', 'html', 'css'] | CASE e WHEN 'java' THEN 'Java' WHEN 'kt' THEN 'Kotlin' WHEN 'kts' THEN 'Kotlin' WHEN 'scala' THEN 'Scala' WHEN 'groovy' THEN 'Groovy' WHEN 'ts' THEN 'TypeScript' WHEN 'tsx' THEN 'TypeScript' WHEN 'js' THEN 'JavaScript' WHEN 'jsx' THEN 'JavaScript' WHEN 'mjs' THEN 'JavaScript' WHEN 'cjs' THEN 'JavaScript' WHEN 'py' THEN 'Python' WHEN 'go' THEN 'Go' WHEN 'rs' THEN 'Rust' WHEN 'rb' THEN 'Ruby' WHEN 'php' THEN 'PHP' WHEN 'cs' THEN 'C#' WHEN 'swift' THEN 'Swift' WHEN 'c' THEN 'C' WHEN 'h' THEN 'C' WHEN 'cpp' THEN 'C++' WHEN 'cc' THEN 'C++' WHEN 'hpp' THEN 'C++' WHEN 'sql' THEN 'SQL' WHEN 'sh' THEN 'Shell' WHEN 'html' THEN 'HTML' WHEN 'css' THEN 'CSS' ELSE '' END]"

# The files one commit changed, keyed by `<project>!<sha>` (a GitCommit's changesKey).
- name: gitChanges
  kind: git
  emit: changes
  compute:
    subjectKey: "toLower(r.commitKey)"
    subjectKind: "'commit'"
    repositoryKey: "toLower(split(r.commitKey, '@')[0])"
    previousPath: "r.oldPath"
    status: "CASE r.status WHEN 'add' THEN 'added' WHEN 'modify' THEN 'modified' WHEN 'delete' THEN 'removed' WHEN 'rename' THEN 'renamed' WHEN 'copy' THEN 'copied' ELSE r.status END"
    additions: "r.linesAdded"
    deletions: "r.linesDeleted"
    kind: "head([p IN [toLower(r.path)] | head([c IN [last(split(r.path, '/'))] | head([f IN [toLower(c)] | head([e IN [CASE WHEN f CONTAINS '.' THEN last(split(f, '.')) ELSE '' END] | CASE WHEN any(x IN ['/test/', '/tests/', '/__tests__/', '/spec/', '/it/', '/testing/', '/testdata/'] WHERE p CONTAINS x) OR any(x IN ['test/', 'tests/', 'spec/', 'testing/', 'testdata/'] WHERE p STARTS WITH x) OR any(x IN ['Test.kt', 'Tests.kt', 'Test.java', 'Tests.java', 'Test.scala', 'Spec.kt', 'Spec.scala', 'Test.cs', 'Tests.cs', 'Test.swift', 'Tests.swift', 'Test.groovy', 'Spec.groovy'] WHERE c ENDS WITH x) OR any(x IN ['.test.ts', '.test.tsx', '.test.js', '.test.jsx', '.test.mjs', '.test.cjs', '.spec.ts', '.spec.tsx', '.spec.js', '.spec.jsx', '.spec.mjs', '_test.go', '_test.py', '_test.rb', '_spec.rb', '_test.exs', '_test.dart'] WHERE f ENDS WITH x) OR (f STARTS WITH 'test_' AND e = 'py') THEN 'test' WHEN e IN ['md', 'mdx', 'adoc', 'asciidoc', 'rst', 'txt'] OR any(x IN ['docs/', 'doc/'] WHERE p STARTS WITH x) OR any(x IN ['/docs/', '/doc/'] WHERE p CONTAINS x) OR f IN ['license', 'notice', 'changelog', 'contributing', 'code_of_conduct', 'authors', 'security', 'codeowners'] OR f STARTS WITH 'readme' OR f STARTS WITH 'license' THEN 'docs' WHEN f IN ['pom.xml', 'build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts', 'gradle.properties', 'mvnw', 'mvnw.cmd', 'gradlew', 'gradlew.bat', 'package.json', 'package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'pyproject.toml', 'setup.py', 'setup.cfg', 'pipfile', 'pipfile.lock', 'poetry.lock', 'uv.lock', 'go.mod', 'go.sum', 'cargo.toml', 'cargo.lock', 'gemfile', 'gemfile.lock', 'makefile', 'cmakelists.txt', 'jenkinsfile', 'flake.nix', 'flake.lock', '.gitlab-ci.yml', 'bitbucket-pipelines.yml', 'renovate.json', 'build.xml', 'build.sbt', 'project.clj', 'deps.edn', 'mix.exs', 'composer.json', 'composer.lock', 'webpack.config.js', 'vite.config.ts', 'vite.config.js', 'vitest.config.ts', 'vitest.config.mjs', 'jest.config.js', 'jest.config.ts', 'babel.config.js', 'rollup.config.js', 'esbuild.mjs', '.npmrc', '.nvmrc', '.tool-versions', 'sonar-project.properties', '.sonarcloud.properties'] OR any(x IN ['tsconfig', 'dockerfile', 'docker-compose', 'compose.', 'requirements'] WHERE f STARTS WITH x) OR any(x IN ['.csproj', '.fsproj', '.vbproj', '.sln', '.props', '.targets', '.gradle', '.gradle.kts', '.nix', '.lock', '.cmake'] WHERE f ENDS WITH x) OR any(x IN ['.github/', '.gitlab/', '.circleci/', '.buildkite/', '.mvn/', 'gradle/', '.azure-pipelines/', '.devcontainer/'] WHERE p STARTS WITH x) OR p CONTAINS '/.github/' THEN 'build' WHEN e IN ['kt', 'kts', 'java', 'scala', 'groovy', 'clj', 'cljs', 'ts', 'tsx', 'js', 'jsx', 'mjs', 'cjs', 'vue', 'svelte', 'py', 'pyi', 'go', 'rs', 'rb', 'php', 'cs', 'fs', 'vb', 'swift', 'm', 'mm', 'c', 'cc', 'cpp', 'cxx', 'h', 'hpp', 'hh', 'sh', 'bash', 'zsh', 'fish', 'ps1', 'bat', 'cmd', 'sql', 'cypher', 'cql', 'html', 'htm', 'css', 'scss', 'sass', 'less', 'dart', 'lua', 'pl', 'pm', 'r', 'jl', 'ex', 'exs', 'erl', 'hs', 'ml', 'mli', 'elm', 'proto', 'graphql', 'gql', 'tf', 'hcl', 'wasm', 'wat', 'ipynb', 'jinja', 'j2', 'ftl', 'mustache', 'hbs', 'ejs', 'jsp', 'thymeleaf', 'scm', 'lisp', 'el'] THEN 'source' WHEN e IN ['csv', 'tsv', 'parquet', 'avro', 'orc', 'jsonl', 'ndjson', 'xlsx', 'xls', 'sqlite', 'db', 'arrow', 'feather', 'npy'] THEN 'data' WHEN e IN ['yml', 'yaml', 'json', 'json5', 'xml', 'properties', 'toml', 'ini', 'cfg', 'conf', 'env', 'editorconfig', 'gitignore', 'gitattributes', 'dockerignore', 'npmignore', 'prettierrc', 'eslintrc', 'plist', 'service'] OR f STARTS WITH '.' THEN 'config' ELSE 'other' END])])])])"
    language: "CASE r.extension WHEN 'java' THEN 'Java' WHEN 'kt' THEN 'Kotlin' WHEN 'kts' THEN 'Kotlin' WHEN 'scala' THEN 'Scala' WHEN 'groovy' THEN 'Groovy' WHEN 'ts' THEN 'TypeScript' WHEN 'tsx' THEN 'TypeScript' WHEN 'js' THEN 'JavaScript' WHEN 'jsx' THEN 'JavaScript' WHEN 'mjs' THEN 'JavaScript' WHEN 'cjs' THEN 'JavaScript' WHEN 'py' THEN 'Python' WHEN 'go' THEN 'Go' WHEN 'rs' THEN 'Rust' WHEN 'rb' THEN 'Ruby' WHEN 'php' THEN 'PHP' WHEN 'cs' THEN 'C#' WHEN 'swift' THEN 'Swift' WHEN 'c' THEN 'C' WHEN 'h' THEN 'C' WHEN 'cpp' THEN 'C++' WHEN 'cc' THEN 'C++' WHEN 'hpp' THEN 'C++' WHEN 'sql' THEN 'SQL' WHEN 'sh' THEN 'Shell' WHEN 'html' THEN 'HTML' WHEN 'css' THEN 'CSS' ELSE '' END"

# Who last changed each line of one file, keyed by `<project>!<path>`.
- name: gitBlame
  kind: git
  emit: blame
  compute:
    key: "toLower(r.repository) + '@' + r.sha"
    title: "r.subject"
    authorKind: "CASE WHEN (toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]') AND any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(r.authorName) CONTAINS x) THEN 'agent' WHEN toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]' THEN 'bot' WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) OR (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'assisted' ELSE 'human' END"
    agentEvidence: "CASE WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) THEN 'trailer' WHEN (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'message' ELSE '' END"
    sourceUrl: "r.link"

# Every commit that changed a run of lines, keyed by `<project>!<path>#<from>-<to>`: one method's
# whole history, where blame gives only the last change to each line.
- name: gitHistory
  kind: git
  emit: history
  compute:
    key: "toLower(r.repository) + '@' + r.sha"
    title: "r.subject"
    authorKind: "CASE WHEN (toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]') AND any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(r.authorName) CONTAINS x) THEN 'agent' WHEN toLower(r.authorName) ENDS WITH '[bot]' OR toLower(r.authorEmail) CONTAINS '[bot]' THEN 'bot' WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) OR (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'assisted' ELSE 'human' END"
    agentEvidence: "CASE WHEN any(a IN r.coAuthors WHERE any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE toLower(a) CONTAINS x)) THEN 'trailer' WHEN (toLower(coalesce(r.message, '')) CONTAINS 'generated with [claude code]' OR any(x IN ['copilot', 'claude', 'devin', 'codex', 'cursor', 'aider', 'jules', 'sweep', 'gemini', 'chatgpt', 'openai'] WHERE any(ph IN [x + ' suggestion', 'suggested by ' + x, 'generated by ' + x, 'generated with ' + x, 'written by ' + x] WHERE toLower(coalesce(r.message, '')) CONTAINS ph))) THEN 'message' ELSE '' END"
    sourceUrl: "r.link"
