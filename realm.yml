name: git
description: |
  A git repository's commits, changed files and line-by-line blame, read live from a clone.
  The history as a graph you can query, read from a clone when a query reaches it:
  its commits (who wrote each, when, with whose help), the files each one changed, and who last
  changed each line of a file. Nothing is ingested and nothing is stored.

  Pin a project and traverse: `MATCH (p:GitProject {key:'https://github.com/acme/shop'})-[:HAS_COMMIT]->(c:GitCommit)`.
  A project is a repository URL, optionally `@` a commit, tag or branch, or a folder that holds a
  `.git` directory: the same keys the code realms read a project by. It works for any host and for a
  repository that exists only on disk; no forge's API is called.

  Every commit says what it touched, so it can be characterised without reading a file: a Java
  change, configuration, documentation, tests, or a mixture. Every file a commit changed carries the
  dev vocabulary's kind (source, test, docs, build, config, data, other) and its language.

  A GitCommit is a Commit and a GitFileChange a FileChange of the dev vocabulary, so a view written
  against the vocabulary reads git as it reads a forge, and a commit here is the commit realm-github
  links to its pull request: both carry the same `key`.

  Requires realm-dev-vocabulary and the appliance's `git` producer kind.
version: 0.1.4
maturity: experimental
url: https://github.com/embabel-worlds/realm-git
author: Rod Johnson
